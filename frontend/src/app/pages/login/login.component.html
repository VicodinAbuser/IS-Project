<div class="auth card">
  <h1>Welcome back</h1>
  <p class="muted">Sign in to the inventory management system</p>
  @if (error()) { <div class="alert error">{{ error() }}</div> }
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field"><label for="email">Email</label><input id="email" type="email" formControlName="email" autocomplete="email" /></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" formControlName="password" autocomplete="current-password" /></div>
    <button class="btn full" type="submit" [disabled]="form.invalid || loading()">{{ loading() ? 'Signing in…' : 'Sign in' }}</button>
  </form>
  <div class="demo">
    <span class="muted">Demo accounts:</span>
    <button class="btn secondary sm" type="button" (click)="fillDemo('admin')">Admin</button>
    <button class="btn secondary sm" type="button" (click)="fillDemo('customer')">Customer</button>
  </div>
  <p class="muted">New customer? <a routerLink="/register">Create an account</a></p>
</div>
