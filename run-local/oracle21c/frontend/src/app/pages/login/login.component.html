<div class="auth card">
  <h1>Sign in</h1>
  @if (serverDown()) {
    <div class="alert error" role="alert">
      We can’t connect right now. Please try again in a moment.
      <button class="link" type="button" (click)="testServer()">Try again</button>
    </div>
  }
  @if (expired()) { <div class="alert warn">Your session has ended. Please sign in again.</div> }
  @if (error()) { <div class="alert error" role="alert">{{ error() }}</div> }
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="email">Email (username)</label>
      <input id="email" type="email" formControlName="email" autocomplete="username" placeholder="you@example.com" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="pw">
        <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" />
        <button type="button" class="eye" (click)="showPassword.set(!showPassword())"
                [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">{{ showPassword() ? '🙈' : '👁' }}</button>
      </div>
    </div>
    <button class="btn full" type="submit" [disabled]="form.invalid || loading()">{{ loading() ? 'Signing in…' : 'Sign in' }}</button>
  </form>
  <p class="muted">New customer? <a routerLink="/register">Create an account</a></p>
</div>
